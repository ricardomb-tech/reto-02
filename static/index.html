<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sentiment Analysis API — Demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    max-width: 640px;
    margin: 3rem auto;
    padding: 0 1.5rem;
    line-height: 1.5;
  }
  h1 { font-size: 1.4rem; }
  textarea {
    width: 100%;
    min-height: 6rem;
    font: inherit;
    padding: 0.6rem;
    box-sizing: border-box;
  }
  button {
    margin-top: 0.75rem;
    padding: 0.5rem 1.2rem;
    font: inherit;
    cursor: pointer;
  }
  #result {
    margin-top: 1.5rem;
    padding: 1rem;
    border-radius: 0.4rem;
    border: 1px solid #8884;
    display: none;
  }
  #result.visible { display: block; }
  .label { font-weight: bold; font-size: 1.1rem; }
  .POSITIVE { color: #1a7f37; }
  .NEGATIVE { color: #c62828; }
  .NEUTRAL { color: #9a7b00; }
  .meta { color: #888; font-size: 0.85rem; margin-top: 0.4rem; }
  .error { color: #c62828; }
</style>
</head>
<body>
  <h1>Sentiment Analysis API</h1>
  <p>Type some text and hit "Analyze" — this calls <code>POST /sentiment</code> on this same server.</p>
  <textarea id="text" placeholder="I absolutely loved this movie!"></textarea>
  <div>
    <button id="analyze">Analyze</button>
  </div>
  <div id="result"></div>

  <script>
    const textEl = document.getElementById("text");
    const buttonEl = document.getElementById("analyze");
    const resultEl = document.getElementById("result");

    async function analyze() {
      const text = textEl.value.trim();
      if (!text) return;

      buttonEl.disabled = true;
      buttonEl.textContent = "Analyzing…";
      resultEl.className = "visible";
      resultEl.textContent = "";

      try {
        const response = await fetch("/sentiment", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
        });
        const body = await response.json();

        if (!response.ok) {
          showError(`Error ${response.status}: ${body.detail || "request failed"}`);
          return;
        }

        showResult(body);
      } catch (err) {
        showError(`Request failed: ${err}`);
      } finally {
        buttonEl.disabled = false;
        buttonEl.textContent = "Analyze";
      }
    }

    function clearResult() {
      while (resultEl.firstChild) resultEl.removeChild(resultEl.firstChild);
    }

    function showError(message) {
      clearResult();
      const span = document.createElement("span");
      span.className = "error";
      span.textContent = message;
      resultEl.appendChild(span);
    }

    function showResult(body) {
      clearResult();
      const labelDiv = document.createElement("div");
      labelDiv.className = `label ${body.label}`;
      labelDiv.textContent = body.label;

      const metaDiv = document.createElement("div");
      metaDiv.className = "meta";
      metaDiv.textContent = `score: ${body.score.toFixed(4)} · cached: ${body.cached}`;

      resultEl.append(labelDiv, metaDiv);
    }

    buttonEl.addEventListener("click", analyze);
    textEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) analyze();
    });
  </script>
</body>
</html>

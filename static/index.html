<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sentiment Analysis API — Demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    max-width: 640px;
    margin: 3rem auto;
    padding: 0 1.5rem;
    line-height: 1.5;
  }
  h1 { font-size: 1.4rem; }
  textarea {
    width: 100%;
    min-height: 6rem;
    font: inherit;
    padding: 0.6rem;
    box-sizing: border-box;
  }
  button {
    margin-top: 0.75rem;
    padding: 0.5rem 1.2rem;
    font: inherit;
    cursor: pointer;
  }
  #result {
    margin-top: 1.5rem;
    padding: 1rem;
    border-radius: 0.4rem;
    border: 1px solid #8884;
    display: none;
  }
  #result.visible { display: block; }
  .label { font-weight: bold; font-size: 1.1rem; }
  .emoji { font-size: 1.4rem; margin-right: 0.4rem; vertical-align: middle; }
  .POSITIVE { color: #1a7f37; }
  .NEGATIVE { color: #c62828; }
  .NEUTRAL { color: #9a7b00; }
  .meta { color: #888; font-size: 0.85rem; margin-top: 0.4rem; }
  .error { color: #c62828; }
  .confidence { margin-top: 0.6rem; display: flex; align-items: center; gap: 0.6rem; }
  .confidence-bar { flex: 1; height: 0.5rem; border-radius: 0.25rem; background: #8882; overflow: hidden; }
  .confidence-fill { height: 100%; border-radius: 0.25rem; }
  .confidence-fill.POSITIVE { background: #1a7f37; }
  .confidence-fill.NEGATIVE { background: #c62828; }
  .confidence-fill.NEUTRAL { background: #9a7b00; }
  .confidence-label { font-size: 0.85rem; color: #888; white-space: nowrap; }
</style>
</head>
<body>
  <h1>Sentiment Analysis API</h1>
  <p>Type some text and hit "Analyze" — this calls <code>POST /sentiment</code> on this same server.</p>
  <textarea id="text" placeholder="I absolutely loved this movie!"></textarea>
  <div>
    <button id="analyze">Analyze</button>
  </div>
  <div id="result"></div>

  <script src="app.js"></script>
</body>
</html>
